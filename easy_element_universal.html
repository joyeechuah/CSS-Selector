<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-size: 32px;
            color: red;
        }

        p{
            font-size: 16px;
            color: blue;
        }

        li{
            margin-bottom: 10px;
        }

        button{
            background-color: orange;
            color: white;
            padding: 10px;
        }

    </style>
</head>
<body>
    <h1>Element and Universal Selectors</h1>
    <p>This is the first paragraph.</p>
    <p>This is the second paragraph.</p>
    <h2>My List</h2>
    <ul>
        <li>First List Item with bottom margin</li>
        <li>Second List Item with bottom margin</li>
        <li>Third List Item with bottom margin</li>
    </ul>
    <button>Click Me</button>
</body>
</html>
