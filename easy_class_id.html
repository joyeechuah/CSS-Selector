<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-title{
            color: blue;
            text-align: center;
        }

        .description{
            color: gray;
            font-size: 18px;
        }

        .btn{
            background-color: green;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #special-container{
            background-color: lightgray;
            padding: 20px;
            border: 2px solid black;
        }

    </style>
</head>
<body>
    <h1 class="main-title">Welcome to CSS Selectors</h1>
    <p class="description">The is a demonstration using class and ID selectors in CSS.</p>
    <button class="btn">Click Me</button>
    <div id="special-container">This is a special container styled using an ID selector.</div>
</body>
</html>
